<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinCos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2322a06b'/%3E%3Cpath d='M3 10l3-3 2 2 5-5' stroke='white' stroke-width='1.8' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"></span>LinCos</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="live" id="live"><span class="dot"></span><span id="liveText">connecting</span></div>
      <div class="agent" id="agent"></div>
      <button id="pause" type="button" title="Freeze the numbers to read them (P)">Pause</button>
    </div>
  </aside>
  <section class="main">
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="hostline" id="hostline"></div>
    </header>
    <div class="view" id="view"></div>
  </section>
</div>
<dialog id="dialog"></dialog>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
<script src="logview.js"></script>
<script src="views.js"></script>
<script src="container.js"></script>
<script>LinCos.start()</script>
</body>
</html>
