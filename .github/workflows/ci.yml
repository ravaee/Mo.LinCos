name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write # attach the binaries to a release

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # tags, for the version in the binaries

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Test
      run: |
        test -z "$(gofmt -l .)" || { echo "not gofmt-formatted:"; gofmt -l .; exit 1; }
        go vet ./...
        go test -race ./...

    - name: Build
      run: make build

    - name: Publish a release for a version tag
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
