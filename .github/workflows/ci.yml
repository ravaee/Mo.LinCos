name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write # attach the binaries to a release
  id-token: write # sign the build attestations
  attestations: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # tags, for the version in the binaries

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Test
      run: |
        test -z "$(gofmt -l .)" || { echo "not gofmt-formatted:"; gofmt -l .; exit 1; }
        go vet ./...
        go test -race ./...

    - name: Build
      run: make build

    # Proof that this workflow built these files from this repo: gh attestation verify <file> --repo ravaee/Mo.LinCos
    - name: Attest the release files
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: dist/*

    - name: Publish a release for a version tag
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes # binaries, lincos.service and SHA256SUMS, which the installers download
